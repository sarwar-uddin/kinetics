# Self-hosted Flatpak build for Kinetics.
#
# NOTE: this manifest is for building and hosting the app myself. It is not a
# Flathub submission -- Flathub requires its own manifest, written by hand, and
# its own review process.
#
# The Qt version matters here. Kirigami comes from the KDE runtime and its QML
# plugin is built against that runtime's Qt (6.11.3). PySide6 wheels ship their
# own copy of Qt, so the pinned PySide6 version must match the runtime exactly
# or the Kirigami plugin will refuse to load into PySide6's QML engine.
id: io.github.sarwar_uddin.Kinetics
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: kinetics

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # PySide6 normally finds Qt's plugins and QML modules next to its own bundled
  # Qt, which this build removes in favour of the runtime's. Point it at the
  # runtime's locations instead -- this is also what lets it see Kirigami.
  - --env=QT_PLUGIN_PATH=/usr/lib/plugins
  - --env=QML_IMPORT_PATH=/usr/lib/qml
  - --env=QML2_IMPORT_PATH=/usr/lib/qml
  # The app saves one small profile file; XDG_CONFIG_HOME inside the sandbox
  # points at the app's own directory, so no host filesystem access is needed.

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.a'
  - '*.la'

modules:
  - name: python-deps
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --prefix=${FLATPAK_DEST} *.whl
      # Drop the Qt that the PySide6 wheel bundles and use the runtime's instead.
      # Three reasons: the versions are identical (6.11.3), so nothing is lost;
      # the bundled copy is 179 MB; and its libQt6Network links libgssapi_krb5,
      # which the KDE runtime does not ship. Most importantly, Kirigami's QML
      # plugin is compiled against the runtime's Qt and will not load into a
      # separate Qt build, so sharing one Qt is what makes the UI work at all.
      - rm -rf ${FLATPAK_DEST}/lib/python3.13/site-packages/PySide6/Qt
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/7c/4a/696e3a9ed26436b1b41ca22dd21e7bce214ba1a1e1dea5c84b5627444c65/shiboken6-6.11.3-cp310-abi3-manylinux_2_34_x86_64.whl
        sha256: e601c957011345c741b88f661a12486f478db881d6777bdf37e3dc7a8d3387c6
      - type: file
        url: https://files.pythonhosted.org/packages/91/23/9692f9b9a7cf89c0e8b99da228a728064aa827dc115b5dc974156bcf14fc/pyside6_essentials-6.11.3-cp310-abi3-manylinux_2_34_x86_64.whl
        sha256: c6a5c3b58bf55aef6e09a7de690ff6133335014ab81a7f22f56363ea08e8f6a3
      - type: file
        url: https://files.pythonhosted.org/packages/40/d6/68dd5a83914bbcaf32b3165993f7955979916708cb0156d1e28231e18803/numpy-2.5.5-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: 824025655df929268bfe6b47ed91a00d14209a6f760847cf150be446829e1ce4
      - type: file
        url: https://files.pythonhosted.org/packages/41/48/6450ed9243315322bbc19ac57b9b70d66a20bf1d38d124c96bc4bf6af9ea/scipy-1.18.1-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: fdaf5ea890a6183d0565f51a61799d67081bd5b1cf03c5f4b3fd3732108625c9

  - name: kinetics
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} .
      - install -Dm644 data/${FLATPAK_ID}.desktop
        ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 data/${FLATPAK_ID}.metainfo.xml
        ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 data/icons/${FLATPAK_ID}.svg
        ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
    sources:
      - type: dir
        path: ../..
